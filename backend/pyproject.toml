[project]
name = "examrag"
version = "0.1.0"
description = "ExamRAG backend - RAG-powered exam preparation assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "python-multipart>=0.0.20",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "sentence-transformers>=5.0.0",
    # Declared explicitly so the CPU-only wheel index below applies to it;
    # sentence-transformers would otherwise pull the CUDA build on Linux.
    "torch>=2.5.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examrag"]

[tool.uv]
default-groups = []

# The application runs CPU-only, and the default Linux torch wheels bundle CUDA
# — around 15 GB of it in the Docker image. macOS wheels are already CPU/MPS,
# so the override is scoped to Linux.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["examrag"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["examrag"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# PyMuPDF ships incomplete annotations, so its calls read as untyped.
[[tool.mypy.overrides]]
module = "examrag.ingestion.pdf_to_markdown"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    # PyMuPDF's SWIG bindings emit these on import; nothing we can act on.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/examrag"]
# SQLAlchemy's async layer switches greenlets, which loses the tracer inside
# route handlers unless coverage is told to follow them.
concurrency = ["thread", "greenlet"]
