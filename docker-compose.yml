services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: examrag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examrag}
      POSTGRES_DB: ${POSTGRES_DB:-examrag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examrag} -d ${POSTGRES_DB:-examrag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: examrag-backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-examrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examrag}
      POSTGRES_DB: ${POSTGRES_DB:-examrag}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      VECTOR_CANDIDATES: ${VECTOR_CANDIDATES:-30}
      KEYWORD_CANDIDATES: ${KEYWORD_CANDIDATES:-30}
      FUSED_CANDIDATES: ${FUSED_CANDIDATES:-30}
      RERANKER_CANDIDATES: ${RERANKER_CANDIDATES:-20}
      FINAL_CONTEXT_CHUNKS: ${FINAL_CONTEXT_CHUNKS:-6}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b-cloud}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-8192}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      # Cache the embedding model on a volume so it downloads once.
      HF_HOME: /data/models
    command: >
      sh -c "alembic upgrade head &&
             python -m examrag.scripts.recover_interrupted_jobs &&
             uvicorn examrag.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./data/uploads:/data/uploads
      - model_cache:/data/models
    depends_on:
      postgres:
        condition: service_healthy
    # Ollama runs on the host rather than as a service: it is often already
    # installed, may use the host GPU, and its models are large enough that a
    # container volume is the wrong place for them.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    container_name: examrag-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  postgres_data:
  model_cache:
